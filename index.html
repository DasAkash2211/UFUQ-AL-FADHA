<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Working History</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #f7f7f5;
            color: #151515;
        }

        /* =========================================
           WORKING HISTORY SECTION
        ========================================= */

        .working-history {
            width: 100%;
            padding: 100px 20px;
            background: #f7f7f5;
            overflow: hidden;
        }

        .working-history-header {
            max-width: 850px;
            margin: 0 auto 55px;
            text-align: center;
        }

        .section-label {
            display: block;
            margin-bottom: 14px;

            font-size: 11px;
            font-weight: 700;
            letter-spacing: 3px;

            color: #777;
        }

        .working-history-header h2 {
            font-size: clamp(38px, 5vw, 64px);
            line-height: 1;
            font-weight: 700;
            letter-spacing: -2px;

            color: #151515;
        }

        .working-history-header p {
            max-width: 520px;
            margin: 20px auto 0;

            font-size: 15px;
            line-height: 1.7;

            color: #777;
        }


        /* =========================================
           SLIDER
        ========================================= */

        .history-slider {
            width: 100%;
            max-width: 1250px;
            margin: 0 auto;
        }


        /* =========================================
           CARD
        ========================================= */

        .history-card {
            width: 100%;

            padding: 30px;

            background: #ffffff;

            border: 1px solid #e5e5e5;
            border-radius: 24px;

            box-shadow:
                0 20px 60px rgba(0, 0, 0, 0.07);
        }


        .history-card-top {
            display: flex;
            align-items: center;
            justify-content: space-between;

            margin-bottom: 28px;

            font-size: 11px;
            font-weight: 700;
            letter-spacing: 2px;

            color: #777;
        }

        .history-number {
            color: #aaa;
        }


        /* =========================================
           BEFORE / AFTER WRAPPER
        ========================================= */

        .before-after-wrapper {
            display: grid;

            grid-template-columns:
                minmax(0, 1fr)
                55px
                minmax(0, 1fr);

            gap: 15px;

            align-items: stretch;
        }


        .history-column {
            min-width: 0;
        }


        /* =========================================
           COLUMN TITLE
        ========================================= */

        .column-title {
            display: flex;
            align-items: center;

            gap: 9px;

            margin-bottom: 15px;

            font-size: 12px;
            font-weight: 800;
            letter-spacing: 2px;
        }

        .before-title {
            color: #777;
        }

        .after-title {
            color: #171717;
        }

        .title-dot {
            width: 7px;
            height: 7px;

            flex-shrink: 0;

            border-radius: 50%;

            background: currentColor;
        }


        /* =========================================
           IMAGE AREA
        ========================================= */

        .history-images {
            display: grid;
            grid-template-columns: 1fr;

            gap: 12px;
        }


        .history-image-box {
            width: 100%;
            height: 190px;

            overflow: hidden;

            border-radius: 14px;

            background: #eeeeee;
        }


        .history-image-box img {
            width: 100%;
            height: 100%;

            display: block;

            object-fit: cover;

            transition:
                transform 0.5s ease,
                filter 0.3s ease;
        }


        .history-image-box:hover img {
            transform: scale(1.04);
        }


        /* =========================================
           CENTER ARROW
        ========================================= */

        .history-divider {
            display: flex;

            flex-direction: column;

            align-items: center;
            justify-content: center;

            gap: 12px;
        }


        .divider-line {
            width: 1px;
            flex: 1;

            background: #dddddd;
        }


        .divider-icon {
            width: 38px;
            height: 38px;

            display: flex;

            align-items: center;
            justify-content: center;

            flex-shrink: 0;

            border: 1px solid #dddddd;
            border-radius: 50%;

            background: #ffffff;

            color: #555;

            font-size: 17px;
        }


        /* =========================================
           SLIDER CONTROLS
        ========================================= */

        .history-controls {
            display: flex;

            align-items: center;
            justify-content: center;

            gap: 25px;

            margin-top: 30px;
        }


        .history-arrow {
            width: 44px;
            height: 44px;

            display: flex;

            align-items: center;
            justify-content: center;

            border: 1px solid #dddddd;
            border-radius: 50%;

            background: #ffffff;

            color: #222222;

            font-size: 18px;

            cursor: pointer;

            transition:
                background 0.25s ease,
                color 0.25s ease,
                transform 0.25s ease;
        }


        .history-arrow:hover {
            background: #111111;
            color: #ffffff;

            transform: translateY(-2px);
        }


        .history-dots {
            display: flex;

            align-items: center;

            gap: 7px;
        }


        .history-dot {
            width: 7px;
            height: 7px;

            padding: 0;

            border: 0;
            border-radius: 50%;

            background: #cccccc;

            cursor: pointer;

            transition:
                width 0.3s ease,
                background 0.3s ease;
        }


        .history-dot.active {
            width: 24px;

            border-radius: 20px;

            background: #222222;
        }


        /* =========================================
           HIDDEN SLIDES
        ========================================= */

        .history-card {
            display: none;
        }

        .history-card.active {
            display: block;
        }


        /* =========================================
           MOBILE
        ========================================= */

        @media (max-width: 768px) {

            .working-history {
                padding: 70px 15px;
            }


            .working-history-header {
                margin-bottom: 35px;
            }


            .working-history-header h2 {
                letter-spacing: -1px;
            }


            .history-card {
                padding: 18px;

                border-radius: 18px;
            }


            .before-after-wrapper {
                grid-template-columns: 1fr;

                gap: 25px;
            }


            .history-divider {
                flex-direction: row;

                width: 100%;
                height: 45px;
            }


            .divider-line {
                width: auto;
                height: 1px;
            }


            .divider-icon {
                flex-shrink: 0;
            }


            .history-images {
                grid-template-columns:
                    repeat(3, minmax(0, 1fr));

                gap: 7px;
            }


            .history-image-box {
                height: 125px;

                border-radius: 9px;
            }


            .column-title {
                font-size: 10px;
            }
        }


        /* =========================================
           SMALL MOBILE
        ========================================= */

        @media (max-width: 480px) {

            .working-history {
                padding-left: 12px;
                padding-right: 12px;
            }


            .history-card {
                padding: 15px;
            }


            .history-images {
                grid-template-columns: 1fr;
            }


            .history-image-box {
                height: 180px;
            }
        }
    </style>
</head>


<body>


    <!-- =====================================================
         WORKING HISTORY
    ====================================================== -->

    <section
        class="working-history"
        id="working-history"
    >


        <!-- SECTION HEADER -->

        <div class="working-history-header">

            <div class="section-label">
                OUR JOURNEY
            </div>

            <h2>
                Working History
            </h2>

            <p>
                See how the work evolved from before to after.
            </p>

        </div>



        <!-- =================================================
             SLIDER
        ================================================== -->

        <div class="history-slider">


            <!-- =================================================
                 CARD 01
            ================================================== -->

            <div
                class="history-card active"
                data-slide="0"
            >


                <!-- CARD HEADER -->

                <div class="history-card-top">

                    <div>
                        WORKING HISTORY
                    </div>

                    <div class="history-number">
                        01 / 01
                    </div>

                </div>



                <!-- =================================================
                     BEFORE / AFTER
                ================================================== -->

                <div class="before-after-wrapper">


                    <!-- =============================================
                         BEFORE
                    ============================================== -->

                    <div class="history-column">


                        <div class="column-title before-title">

                            <span class="title-dot"></span>

                            BEFORE

                        </div>


                        <div class="history-images">


                            <!-- BEFORE IMAGE 1 -->

                            <div class="history-image-box">

                                <img
                                    src="assets/b1.jpg"
                                    alt="Before work"
                                    loading="lazy"
                                >

                            </div>


                            <!-- BEFORE IMAGE 2 -->

                            <div class="history-image-box">

                                <img
                                    src="assets/b2.jpg"
                                    alt="Before work"
                                    loading="lazy"
                                >

                            </div>


                            <!-- BEFORE IMAGE 3 -->

                            <div class="history-image-box">

                                <img
                                    src="assets/b3.jpg"
                                    alt="Before work"
                                    loading="lazy"
                                >

                            </div>


                        </div>

                    </div>



                    <!-- =============================================
                         CENTER DIVIDER
                    ============================================== -->

                    <div class="history-divider">


                        <div class="divider-line"></div>


                        <div class="divider-icon">
                            →
                        </div>


                        <div class="divider-line"></div>


                    </div>



                    <!-- =============================================
                         AFTER
                    ============================================== -->

                    <div class="history-column">


                        <div class="column-title after-title">

                            <span class="title-dot"></span>

                            AFTER

                        </div>


                        <div class="history-images">


                            <!-- AFTER IMAGE 1 -->

                            <div class="history-image-box">

                                <img
                                    src="assets/a1.jpg"
                                    alt="After work"
                                    loading="lazy"
                                >

                            </div>


                            <!-- AFTER IMAGE 2 -->

                            <div class="history-image-box">

                                <img
                                    src="assets/a2.jpg"
                                    alt="After work"
                                    loading="lazy"
                                >

                            </div>


                            <!-- AFTER IMAGE 3 -->

                            <div class="history-image-box">

                                <img
                                    src="assets/a3.jpg"
                                    alt="After work"
                                    loading="lazy"
                                >

                            </div>


                        </div>

                    </div>


                </div>

            </div>



            <!-- =================================================
                 SLIDER CONTROLS
            ================================================== -->

            <div class="history-controls">


                <!-- PREVIOUS -->

                <button
                    class="history-arrow history-prev"
                    type="button"
                    aria-label="Previous"
                >
                    ←
                </button>



                <!-- DOTS -->

                <div class="history-dots">

                    <button
                        class="history-dot active"
                        type="button"
                        aria-label="Slide 1"
                    ></button>

                </div>



                <!-- NEXT -->

                <button
                    class="history-arrow history-next"
                    type="button"
                    aria-label="Next"
                >
                    →
                </button>


            </div>


        </div>

    </section>



    <!-- =====================================================
         JAVASCRIPT
    ====================================================== -->

    <script>

        document.addEventListener(
            "DOMContentLoaded",
            function () {


                const cards =
                    document.querySelectorAll(
                        ".history-card"
                    );


                const dots =
                    document.querySelectorAll(
                        ".history-dot"
                    );


                const prevButton =
                    document.querySelector(
                        ".history-prev"
                    );


                const nextButton =
                    document.querySelector(
                        ".history-next"
                    );


                let currentSlide = 0;



                /* =============================================
                   SHOW SLIDE
                ============================================== */

                function showSlide(index) {


                    if (!cards.length) {
                        return;
                    }


                    /* LOOP TO LAST */

                    if (index < 0) {
                        index = cards.length - 1;
                    }


                    /* LOOP TO FIRST */

                    if (index >= cards.length) {
                        index = 0;
                    }


                    currentSlide = index;



                    /* SHOW / HIDE CARDS */

                    cards.forEach(
                        function (card, cardIndex) {

                            if (
                                cardIndex === currentSlide
                            ) {

                                card.classList.add(
                                    "active"
                                );

                            } else {

                                card.classList.remove(
                                    "active"
                                );

                            }

                        }
                    );



                    /* UPDATE DOTS */

                    dots.forEach(
                        function (dot, dotIndex) {

                            if (
                                dotIndex === currentSlide
                            ) {

                                dot.classList.add(
                                    "active"
                                );

                            } else {

                                dot.classList.remove(
                                    "active"
                                );

                            }

                        }
                    );

                }



                /* =============================================
                   PREVIOUS BUTTON
                ============================================== */

                if (prevButton) {

                    prevButton.addEventListener(
                        "click",
                        function () {

                            showSlide(
                                currentSlide - 1
                            );

                        }
                    );

                }



                /* =============================================
                   NEXT BUTTON
                ============================================== */

                if (nextButton) {

                    nextButton.addEventListener(
                        "click",
                        function () {

                            showSlide(
                                currentSlide + 1
                            );

                        }
                    );

                }



                /* =============================================
                   DOT BUTTONS
                ============================================== */

                dots.forEach(
                    function (dot, index) {

                        dot.addEventListener(
                            "click",
                            function () {

                                showSlide(index);

                            }
                        );

                    }
                );



                /* =============================================
                   INITIAL SLIDE
                ============================================== */

                showSlide(0);


            }
        );

    </script>


</body>
</html>
